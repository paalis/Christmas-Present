<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-billett</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<style>
  :root { --paper:#f7efdf; --ink:#2a2420; --red:#b3262e; --gold:#d1a849; --pine:#163a2e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px 16px; background:#e9e4da; font-family:"Fraunces",Georgia,serif; color:var(--ink); }
  .ticket { width:min(520px,100%); display:grid; grid-template-columns:1fr 170px; background:var(--paper); border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.18); }
  .main { padding:0 22px 22px; position:relative; }
  .head { display:flex; justify-content:space-between; margin:0 -22px 18px; padding:10px 22px; background:var(--red); color:var(--paper); font:600 .66rem "IBM Plex Mono",monospace; letter-spacing:.14em; }
  h1 { margin:0; font-size:1.9rem; line-height:1.1; }
  h1 em { color:var(--red); }
  p { margin:10px 0 0; font-style:italic; color:#5a4d40; }
  .lbl { display:block; margin-top:18px; font:.62rem "IBM Plex Mono",monospace; letter-spacing:.16em; text-transform:uppercase; color:#8a7c6a; }
  .to { font-weight:700; font-size:1.1rem; }
  .stub { border-left:2px dashed #c9b994; padding:18px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:#fbf6ea; }
  .stub svg { width:100%; height:auto; display:block; }
  .scan { font:600 .62rem "IBM Plex Mono",monospace; letter-spacing:.2em; color:var(--red); }
  .tools { display:flex; flex-direction:column; gap:8px; width:min(520px,100%); font:.85rem "IBM Plex Mono",monospace; }
  .tools input { width:100%; padding:10px; border-radius:8px; border:1px solid #bbb; font:inherit; }
  .tools button { padding:12px; border-radius:999px; border:0; background:var(--pine); color:#fff; font:600 1rem "Fraunces",serif; cursor:pointer; }
  @media (max-width:420px){ .ticket{ grid-template-columns:1fr; } .stub{ border-left:0; border-top:2px dashed #c9b994; } .stub svg{ width:180px; } }
  @media print { body{ background:#fff; min-height:0; } .tools{ display:none; } .ticket{ box-shadow:none; border:1px solid #ccc; } }
</style>
</head>
<body>
  <article class="ticket">
    <div class="main">
      <div class="head"><span>MYSTERIEREISEN</span><span>GYLDIG FOR 2</span></div>
      <h1>Du skal ut på <em>reise</em>.</h1>
      <p>Hvor? Det er en hemmelighet.<br>Når? Det bestemmer du.</p>
      <span class="lbl">Passasjer</span>
      <span class="to" id="to"></span>
    </div>
    <div class="stub">
      <div id="qr"></div>
      <span class="scan">SKANN MEG ✶</span>
    </div>
  </article>

  <div class="tools">
    <label for="url">Adressen QR-koden peker til:</label>
    <input id="url" type="url">
    <button onclick="window.print()">Skriv ut</button>
  </div>

<script>
  const C = window.TUR || {};
  document.getElementById("to").textContent = C.til || "";
  const input = document.getElementById("url");
  input.value = C.nettadresse || location.href.replace(/qr\.html.*$/, "");
  function draw() {
    const q = qrcode(0, "M");
    q.addData(input.value.trim());
    q.make();
    document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  }
  input.addEventListener("input", draw);
  draw();
</script>
</body>
</html>
