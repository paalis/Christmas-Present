<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold av noen datoer?</title>
<meta name="description" content="Et lite spørsmål til deg 😊">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f1ec">
<meta property="og:type" content="website">
<meta property="og:title" content="Hold av noen datoer?">
<meta property="og:description" content="Et lite spørsmål til deg 😊">
<meta property="og:url" content="https://hold-av-datoer.vercel.app/">
<meta property="og:image" content="https://hold-av-datoer.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="En kalender med noen datoer markert">
<meta property="og:locale" content="nb_NO">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="pick" class="screen active">
  <p class="greeting" id="greeting"></p>

  <div class="card suggestion" id="sugBox">
    <span class="label">Mitt forslag</span>
    <p class="sug-dates" id="sugText"></p>
    <button class="primary" id="sugBtn">Det passer! 🙌</button>
    <div id="altsWrap" hidden>
      <p class="or">eller</p>
      <div class="alts" id="alts"></div>
    </div>
    <p class="sub small-sub">Passer det ikke? Velg selv i kalenderen under, og skriv en liten kommentar.</p>
  </div>

  <p class="error" id="error" role="alert" hidden></p>

  <div class="card cal-card">
    <h2>Velg selv</h2>
    <p class="sub" id="calSub"></p>
    <div class="cal-nav">
      <button class="icon" id="prev" aria-label="Forrige måned">‹</button>
      <span id="monthLabel"></span>
      <button class="icon" id="next" aria-label="Neste måned">›</button>
    </div>
    <div class="cal-grid dow" aria-hidden="true">
      <span>ma</span><span>ti</span><span>on</span><span>to</span><span>fr</span><span>lø</span><span>sø</span>
    </div>
    <div class="cal-grid" id="days" role="grid"></div>
    <p class="selection" id="selText" aria-live="polite">Ingen dato valgt ennå</p>
    <label class="note">
      <span class="label" id="commentLabel">Kommentar (valgfritt)</span>
      <textarea id="comment" rows="2" maxlength="500" placeholder="Noe jeg bør vite?"></textarea>
      <span class="hint" id="commentHint" hidden>Skriv en kort kommentar for å sende andre datoer enn forslaget.</span>
    </label>
    <button class="primary" id="confirm" disabled>Send datoene</button>
  </div>
</section>

<section id="done" class="screen">
  <div class="card confirm-card">
    <h2>Tusen takk!</h2>
    <p class="sub">Da holder vi av</p>
    <p class="big-date" id="fDep"></p>
    <p class="to-sep">til</p>
    <p class="big-date" id="fRet"></p>
    <p class="comment-echo" id="fComment" hidden></p>
    <p class="sub sent-note">Svaret ditt er sendt til meg ✓</p>
    <button class="link" id="change">Endre dato</button>
  </div>
</section>

<script src="config.js"></script>
<script src="dato.js"></script>
<script src="regler.js"></script>
<script src="app.js"></script>
</body>
</html>
