<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold av noen datoer?</title>
<meta name="description" content="Et lite spørsmål til deg 😊">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e8dcd4">
<meta property="og:type" content="website">
<meta property="og:title" content="Hold av noen datoer?">
<meta property="og:description" content="Et lite spørsmål til deg 😊">
<meta property="og:url" content="https://hold-av-datoer.vercel.app/">
<meta property="og:image" content="https://hold-av-datoer.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Hold av noen datoer?">
<meta property="og:locale" content="nb_NO">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='%23141212'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <span class="dot-label" id="toName">Til deg</span>
  <span class="dot-label right">Et lite spørsmål</span>
</header>

<main>
<section id="pick" class="screen active">
  <div class="hero">
    <h1 class="giant" id="heroTitle"></h1>
    <p class="lede" id="greeting"></p>
    <span class="vertical" aria-hidden="true">Hold av<i class="dot"></i></span>
  </div>

  <div class="block suggestion" id="sugBox">
    <span class="dot-label">Mitt forslag</span>
    <p class="sug-big" aria-hidden="true"><span id="sugBig"></span><span class="sug-month" id="sugMonth"></span></p>
    <p class="sug-dates" id="sugText"></p>
    <button class="primary" id="sugBtn">Det passer <span aria-hidden="true">→</span></button>
    <div id="altsWrap" hidden>
      <p class="or">eller</p>
      <div class="alts" id="alts"></div>
    </div>
  </div>

  <p class="error" id="error" role="alert" hidden></p>

  <div class="block cal-card">
    <span class="dot-label">Passer det ikke?</span>
    <h2>Velg selv</h2>
    <p class="sub" id="calSub"></p>
    <div class="cal-nav">
      <button class="icon" id="prev" aria-label="Forrige måned">←</button>
      <span id="monthLabel"></span>
      <button class="icon" id="next" aria-label="Neste måned">→</button>
    </div>
    <div class="cal-grid dow" aria-hidden="true">
      <span>ma</span><span>ti</span><span>on</span><span>to</span><span>fr</span><span>lø</span><span>sø</span>
    </div>
    <div class="cal-grid" id="days" role="grid"></div>
    <p class="selection" id="selText" aria-live="polite">Ingen dato valgt ennå</p>
    <label class="note">
      <span class="dot-label" id="commentLabel">Kommentar</span>
      <textarea id="comment" rows="2" maxlength="500" placeholder="Noe jeg bør vite?"></textarea>
      <span class="hint" id="commentHint" hidden>Skriv en kort kommentar for å sende andre datoer enn forslaget.</span>
    </label>
    <button class="primary outline" id="confirm" disabled>Send datoene <span aria-hidden="true">→</span></button>
  </div>
</section>

<section id="done" class="screen">
  <div class="hero">
    <h2 class="giant">Tusen takk!</h2>
    <span class="vertical" aria-hidden="true">Holdt av<i class="dot"></i></span>
  </div>
  <div class="block confirm-card">
    <span class="dot-label">Da holder vi av</span>
    <p class="big-date" id="fDep"></p>
    <p class="to-sep">til</p>
    <p class="big-date" id="fRet"></p>
    <p class="comment-echo" id="fComment" hidden></p>
    <p class="sent-note">Svaret ditt er sendt til meg ✓</p>
    <button class="link" id="change">Endre dato</button>
  </div>
</section>
</main>

<script src="config.js"></script>
<script src="dato.js"></script>
<script src="regler.js"></script>
<script src="app.js"></script>
</body>
</html>
