<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Når passer det?</title>
<meta name="theme-color" content="#0c1f19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<!-- 1. VELG DATO -->
<section id="pick" class="screen active">
  <p class="greeting" id="greeting"></p>

  <div class="card suggestion" id="sugBox">
    <span class="label">Mitt forslag</span>
    <p class="sug-dates" id="sugText"></p>
    <button class="primary" id="sugBtn">Det passer! 🙌</button>
    <p class="sub small-sub">Passer ikke det? Velg en annen helg i kalenderen under.</p>
  </div>

  <div class="card cal-card">
    <h2 id="calTitle">Velg selv</h2>
    <p class="sub" id="calSub"></p>
    <div class="cal-nav">
      <button class="icon" id="prev" aria-label="Forrige måned">‹</button>
      <span id="monthLabel"></span>
      <button class="icon" id="next" aria-label="Neste måned">›</button>
    </div>
    <div class="cal-grid dow" aria-hidden="true">
      <span>ma</span><span>ti</span><span>on</span><span>to</span><span>fr</span><span>lø</span><span>sø</span>
    </div>
    <div class="cal-grid" id="days" role="grid"></div>
    <p class="selection" id="selText" aria-live="polite">Ingen dato valgt ennå</p>
    <label class="note">
      <span class="label">Kommentar (valgfritt)</span>
      <textarea id="comment" rows="2" placeholder="F.eks. «Helst ikke tidlig fly 😴»"></textarea>
    </label>
    <button class="primary" id="confirm" disabled>Send datoene</button>
  </div>
</section>

<!-- 2. BEKREFTET -->
<section id="done" class="screen">
  <div class="card confirm-card">
    <span class="label">Da holder vi av</span>
    <p class="big-date" id="fDep"></p>
    <p class="to-sep">til</p>
    <p class="big-date" id="fRet"></p>
    <p class="comment-echo" id="fComment" hidden></p>
  </div>

  <div class="card">
    <h2>Tusen takk! ❤️</h2>
    <p class="sub" id="sendSub">Send svaret til meg, så ordner jeg resten.</p>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="actions" id="actions"></div>
    <button class="link" id="change">Endre dato</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
